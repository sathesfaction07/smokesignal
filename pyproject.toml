[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bedrock-review-intel"
version = "1.0.0"
description = "4-stage AI pipeline analyzing Amazon reviews for safety/quality risks via Bedrock (Nova Micro + Claude Haiku 4.5)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
    "flask>=3.0.0",
    "selenium>=4.15.0",
    "tiktoken>=0.5.0",
    "python-dotenv>=1.0.0",
    "strands-agents>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
bedrock-review-intel = "app:main"

[tool.ruff]
target-version = "py310"
line-length = 100
src = [".", "agents", "monitoring"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.hatch.build.targets.wheel]
packages = ["agents", "monitoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
