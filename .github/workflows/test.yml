name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check . agents monitoring

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Verify core imports
        run: |
          python -c "import boto3, flask, selenium, tiktoken; print('Core imports OK')"
          python -c "from agents import review_fetcher, review_analyzer; print('Agent imports OK')"
          python -c "from monitoring import logger, token_tracker, daily_cache; print('Monitoring imports OK')"
